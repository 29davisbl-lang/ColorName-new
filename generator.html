<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f3ed">
  <title>TheColors | Color Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #171914;
      --paper: #f2f3ed;
      --muted: #74776e;
      --line: #d9dbd2;
      --acid: #d9ff43;
      --blue: #3558ff;
      --mono: "DM Mono", "Courier New", monospace;
      --sans: "Space Grotesk", "Trebuchet MS", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background-color: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }

    button { font: inherit; }

    .topbar {
      min-height: 70px;
      padding: 0 clamp(20px, 5vw, 72px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: inherit;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
    }

    .mark {
      width: 21px;
      height: 21px;
      display: grid;
      place-items: center;
      background: var(--ink);
      color: var(--acid);
      font-size: 14px;
      line-height: 1;
    }

    .top-note, .eyebrow, .section-label, .swatch-index {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .top-note { color: var(--muted); }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }

    .nav-icon:hover { background: white; border-color: var(--ink); }
    .nav-icon:focus-visible, .dashboard-back:focus-visible, .color-filter:focus-visible, .color-tile:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
    .nav-icon svg { width: 19px; height: 19px; }

    main {
      width: min(1240px, 100%);
      margin: 0 auto;
      padding: clamp(32px, 6vh, 64px) clamp(20px, 5vw, 72px) 40px;
    }

    .intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
    }

    .eyebrow { margin: 0 0 11px; color: var(--muted); }

    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1;
      font-weight: 600;
    }

    .intro-note {
      max-width: 210px;
      margin: 0 0 2px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      text-align: right;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 28px;
      align-items: stretch;
    }

    .swatch-wrap { min-width: 0; }

    .color-swatch {
      position: relative;
      min-height: 440px;
      height: min(54vh, 620px);
      overflow: hidden;
      background: var(--acid);
      border: 1px solid rgb(23 25 20 / 8%);
      border-radius: 6px;
      transition: background-color 180ms ease;
    }

    .swatch-index {
      position: absolute;
      top: 18px;
      left: 18px;
      padding: 8px 10px;
      background: rgb(255 255 255 / 78%);
      color: var(--ink);
      backdrop-filter: blur(8px);
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 22px 0 0;
    }

    .section-label { margin: 0 0 13px; color: var(--muted); }

    .value-row {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--line);
    }

    .color-code {
      flex: 1 1 auto;
      width: 100%;
      min-width: 0;
      height: 48px;
      overflow: hidden;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: white;
      color: inherit;
      font-family: var(--mono);
      font-size: clamp(26px, 3vw, 34px);
      font-weight: 500;
      text-overflow: ellipsis;
      cursor: text;
      transition: border-color 150ms ease;
    }

    .color-code:hover { border-color: #9b9d95; }
    .color-code:focus-visible { border-color: var(--blue); outline: 3px solid var(--blue); outline-offset: 3px; }
    .color-code[aria-invalid="true"] { border-color: #c33; text-decoration: underline wavy #c33; text-decoration-thickness: 1px; }

    .value-actions { display: flex; flex: 0 0 auto; gap: 6px; }

    .copy-btn {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      transition: background-color 150ms ease, border-color 150ms ease;
    }

    .apply-hex-btn { width: 38px; }

    .copy-btn:hover { border-color: var(--ink); background: white; }
    .copy-btn:focus-visible, .name-input:focus-visible, .name-submit:focus-visible, .generate-btn:focus-visible, .recent-swatch:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
    .copy-btn svg { width: 18px; height: 18px; }
    .save-btn[aria-pressed="true"] { border-color: var(--blue); color: var(--blue); background: white; }

    .color-name {
      min-height: 18px;
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .name-form { margin-top: 21px; }

    .name-form .section-label { display: block; margin-bottom: 9px; }

    .name-entry { display: flex; gap: 7px; }

    .name-input {
      width: 100%;
      min-width: 0;
      height: 44px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: white;
      color: var(--ink);
      font: 13px var(--sans);
    }

    .name-input::placeholder { color: #888b82; }

    .name-submit {
      min-width: 68px;
      padding: 0 13px;
      border: 1px solid var(--blue);
      border-radius: 4px;
      background: var(--blue);
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 150ms ease, color 150ms ease;
    }

    .name-submit:hover { background: white; color: var(--blue); }

    .shade-controls { margin-top: 12px; }

    .shade-toggle {
      min-height: 36px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: transparent;
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .shade-toggle:hover { border-color: var(--ink); background: white; }
    .shade-toggle:focus-visible, .shade-option:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

    .shade-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
      margin-top: 10px;
    }

    .shade-grid[hidden] { display: none; }

    .shade-option {
      min-width: 0;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: white;
      color: var(--ink);
      cursor: pointer;
      text-align: left;
    }

    .shade-option:hover { border-color: var(--ink); }
    .shade-chip { display: block; aspect-ratio: 1.5; border-radius: 2px; }
    .shade-label { display: block; overflow: hidden; padding: 5px 1px 1px; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }

    .generate-btn {
      width: 100%;
      min-height: 54px;
      margin-top: 20px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--ink);
      border-radius: 4px;
      background: var(--ink);
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: color 150ms ease, background-color 150ms ease;
    }

    .generate-btn:hover { background: var(--acid); color: var(--ink); }
    .generate-btn kbd { color: inherit; font: 11px var(--mono); opacity: 0.65; }

    .feedback {
      min-height: 24px;
      margin: 9px 0 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
    }

    .recent { margin-top: auto; padding-top: 30px; }

    .recent-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .recent-heading .section-label { margin: 0; }
    .recent-count { color: var(--muted); font: 11px var(--mono); }

    .recent-list {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding-top: 13px;
    }

    .recent-swatch {
      aspect-ratio: 1;
      min-width: 0;
      border: 1px solid rgb(23 25 20 / 12%);
      border-radius: 3px;
      cursor: pointer;
      transition: transform 130ms ease;
    }

    .recent-swatch:hover { transform: translateY(-2px); }

    .hint {
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .dashboard-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
    }

    .dashboard-heading .eyebrow { margin-bottom: 11px; }

    .dashboard-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .dashboard-tab {
      min-height: 42px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
    }

    .dashboard-tab[aria-selected="true"] { border-bottom-color: var(--blue); color: var(--ink); font-weight: 600; }
    .dashboard-tab:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
    .tab-count { color: var(--muted); font: 10px var(--mono); }

    .dashboard-back {
      min-height: 42px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: transparent;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .dashboard-back:hover { background: white; border-color: var(--ink); }
    .dashboard-back svg { width: 17px; height: 17px; }

    .dashboard-toolbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 17px;
    }

    .filter-label { display: grid; gap: 8px; width: min(360px, 100%); }
    .filter-label .section-label { margin: 0; }

    .color-filter {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: white;
      color: var(--ink);
      font: 13px var(--sans);
    }

    .dashboard-count { margin: 0 0 2px; color: var(--muted); font: 11px var(--mono); }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .color-tile {
      position: relative;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: white;
      color: var(--ink);
      transition: border-color 140ms ease, transform 140ms ease;
    }

    .color-tile:hover { border-color: var(--ink); transform: translateY(-2px); }

    .color-tile-select {
      width: 100%;
      display: block;
      padding: 8px;
      border: 0;
      border-radius: inherit;
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .color-tile-select:focus-visible, .tile-save:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

    .tile-save {
      position: absolute;
      top: 13px;
      right: 13px;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid rgb(23 25 20 / 12%);
      border-radius: 50%;
      background: rgb(255 255 255 / 94%);
      color: var(--ink);
      cursor: pointer;
    }

    .tile-save svg { width: 16px; height: 16px; }
    .tile-save[aria-pressed="true"] { color: var(--blue); }
    .tile-save[aria-pressed="true"] path { fill: currentColor; }

    .empty-state { grid-column: 1 / -1; margin: 8px 0; color: var(--muted); font-size: 14px; }

    .color-tile-swatch {
      display: block;
      width: 100%;
      aspect-ratio: 1.8;
      border: 1px solid rgb(23 25 20 / 10%);
      border-radius: 3px;
    }

    .color-tile-meta { display: grid; gap: 4px; padding: 10px 2px 2px; }
    .color-tile-name { overflow: hidden; font-size: 13px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .color-tile-hex { color: var(--muted); font: 10px var(--mono); }

    @media (max-width: 760px) {
      .topbar { min-height: 60px; }
      main { padding-top: 34px; }
      .workspace { grid-template-columns: minmax(0, 1fr); gap: 10px; }
      .color-swatch { min-height: 300px; height: min(48vh, 460px); }
      .side-panel { padding-top: 17px; }
      .recent { margin-top: 12px; padding-top: 10px; }
      .recent-list { grid-template-columns: repeat(8, minmax(0, 1fr)); }
      .color-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    @media (max-width: 440px) {
      .top-note { font-size: 9px; }
      .intro { align-items: start; flex-direction: column; gap: 10px; }
      h1 { font-size: 34px; }
      .intro-note { max-width: none; text-align: left; }
      .color-swatch { min-height: 270px; }
      .recent-list { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .top-note { display: none; }
      .dashboard-heading { align-items: start; flex-direction: column; margin-bottom: 22px; }
      .dashboard-toolbar { align-items: start; flex-direction: column; gap: 10px; }
      .color-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="index.html" aria-label="TheColors home"><span class="mark" aria-hidden="true">T</span> TheColors</a>
    <div class="topbar-actions">
      <span class="top-note">A tiny tool for happy accidents</span>
      <a class="nav-icon" href="index.html" aria-label="Go to home page" title="Home">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m3.5 10.5 8.5-7 8.5 7v9a1 1 0 0 1-1 1h-5.5v-6h-4v6H4.5a1 1 0 0 1-1-1v-9Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
      <a class="nav-icon" href="instructions.html" aria-label="Open instructions" title="Instructions">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7" />
          <path d="M9.8 9a2.3 2.3 0 1 1 3.8 1.7c-.9.8-1.6 1.2-1.6 2.8m0 3v.1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
      </a>
      <button id="dashboardToggle" class="nav-icon" type="button" aria-label="Open color dashboard" title="Open color dashboard" aria-controls="dashboardView" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3.5" y="3.5" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.6" />
          <rect x="13.5" y="3.5" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.6" />
          <rect x="3.5" y="13.5" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.6" />
          <rect x="13.5" y="13.5" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.6" />
        </svg>
      </button>
    </div>
  </header>

  <main>
    <div id="generatorView">
      <section class="intro" aria-labelledby="pageTitle">
        <div>
          <p class="eyebrow">COLOR STUDY &nbsp; / &nbsp; 001</p>
          <h1 id="pageTitle">Pick a new hue.</h1>
        </div>
        <p class="intro-note">One click, one color. Keep the ones that catch your eye.</p>
      </section>

      <section class="workspace" aria-label="Random color generator">
      <div class="swatch-wrap">
        <div id="colorSwatch" class="color-swatch" role="img" aria-label="Generated color swatch">
        </div>
      </div>

      <aside class="side-panel">
        <div>
          <label class="section-label" for="colorCode">HEX VALUE / EDITABLE</label>
          <div class="value-row">
            <input id="colorCode" class="color-code" type="text" value="#D9FF43" maxlength="7" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="colorName" aria-invalid="false">
            <div class="value-actions">
              <button id="applyHexBtn" class="copy-btn apply-hex-btn" type="button" aria-label="Apply hex value" title="Apply hex value">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <circle cx="10.8" cy="10.8" r="6.3" stroke="currentColor" stroke-width="1.7" />
                  <path d="m15.5 15.5 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
                </svg>
              </button>
              <button id="copyBtn" class="copy-btn" type="button" aria-label="Copy hex value" title="Copy hex value">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <rect x="8" y="8" width="12" height="12" rx="1.5" stroke="currentColor" stroke-width="1.7" />
                  <path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8" stroke="currentColor" stroke-width="1.7" />
                </svg>
              </button>
              <button id="saveBtn" class="copy-btn save-btn" type="button" aria-label="Save color" title="Save color" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M6.5 4.5h11v16l-5.5-3.8-5.5 3.8v-16Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
          </div>
          <p id="colorName" class="color-name" aria-live="polite">Random color</p>
          <form id="nameForm" class="name-form">
            <label class="section-label" for="colorNameInput">COLOR NAME / SHADE</label>
            <div class="name-entry">
              <input id="colorNameInput" class="name-input" type="text" maxlength="40" autocomplete="off" spellcheck="false" placeholder="Any name or shade">
              <button class="name-submit" type="submit">Find</button>
            </div>
          </form>
          <div class="shade-controls">
            <button id="shadeToggle" class="shade-toggle" type="button" aria-expanded="false" aria-controls="shadeGrid" hidden>Show shades</button>
            <div id="shadeGrid" class="shade-grid" aria-label="Color shades" hidden></div>
          </div>
          <button id="generateBtn" class="generate-btn" type="button">
            <span>Generate color</span><kbd>ENTER</kbd>
          </button>
          <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
        </div>

        <div class="recent">
          <div class="recent-heading">
            <p class="section-label">RECENT COLORS</p>
            <span id="recentCount" class="recent-count">0 / 8</span>
          </div>
          <div id="recentColors" class="recent-list" aria-label="Recent colors"></div>
          <p class="hint">Select a swatch to bring it back.</p>
        </div>
      </aside>
      </section>
    </div>

    <section id="dashboardView" class="dashboard-view" aria-labelledby="dashboardTitle" hidden>
      <div class="dashboard-heading">
        <div>
          <p class="eyebrow">PALETTE &nbsp; / &nbsp; BROWSE</p>
          <h1 id="dashboardTitle">Color dashboard</h1>
        </div>
        <button id="dashboardBack" class="dashboard-back" type="button">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M19 12H5m0 0 6 6m-6-6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>Back to generator</span>
        </button>
      </div>
      <div class="dashboard-tabs" role="tablist" aria-label="Color collections">
        <button id="paletteTab" class="dashboard-tab" type="button" role="tab" aria-selected="true">Palette</button>
        <button id="savedTab" class="dashboard-tab" type="button" role="tab" aria-selected="false">Saved <span id="savedColorCount" class="tab-count">0</span></button>
      </div>
      <div class="dashboard-toolbar">
        <label class="filter-label">
          <span class="section-label">SEARCH COLORS</span>
          <input id="colorFilter" class="color-filter" type="search" placeholder="Name or hex value" autocomplete="off">
        </label>
        <p id="dashboardCount" class="dashboard-count" aria-live="polite"></p>
      </div>
      <div id="colorGrid" class="color-grid" aria-label="Color palette"></div>
    </section>
  </main>

  <script>
    const colorSwatch = document.getElementById('colorSwatch');
    const colorCode = document.getElementById('colorCode');
    const generateBtn = document.getElementById('generateBtn');
    const applyHexBtn = document.getElementById('applyHexBtn');
    const copyBtn = document.getElementById('copyBtn');
    const saveBtn = document.getElementById('saveBtn');
    const feedback = document.getElementById('feedback');
    const colorName = document.getElementById('colorName');

    function getSavedColorName(hex, name) {
      if (!['random color', 'saved color'].includes(name.trim().toLowerCase())) return name;

      const red = Number.parseInt(hex.slice(1, 3), 16);
      const green = Number.parseInt(hex.slice(3, 5), 16);
      const blue = Number.parseInt(hex.slice(5, 7), 16);
      let closestColor = colorPresets[0];
      let closestDistance = Infinity;

      for (const preset of colorPresets) {
        const presetRed = Number.parseInt(preset.hex.slice(1, 3), 16);
        const presetGreen = Number.parseInt(preset.hex.slice(3, 5), 16);
        const presetBlue = Number.parseInt(preset.hex.slice(5, 7), 16);
        const redMean = (red + presetRed) / 2;
        const deltaRed = red - presetRed;
        const deltaGreen = green - presetGreen;
        const deltaBlue = blue - presetBlue;
        const distance = (2 + redMean / 256) * deltaRed ** 2 + 4 * deltaGreen ** 2 + (2 + (255 - redMean) / 256) * deltaBlue ** 2;
        if (distance < closestDistance) {
          closestColor = preset;
          closestDistance = distance;
        }
      }

      return closestColor.name;
    }

      const normalizedName = nameWords.join('');
      if (!normalizedName || ['currentcolor', 'inherit', 'initial', 'revert', 'transparent', 'unset'].includes(normalizedName)) return null;

      const context = document.createElement('canvas').getContext('2d');
      const exactColor = resolveNamedColor(normalizedName, context);
      if (exactColor) return exactColor;

      const modifierWords = nameWords.filter((word) => shadeModifiers.has(word));
      const baseWords = nameWords.filter((word) => !shadeModifiers.has(word) && !['color', 'shade', 'of', 'the', 'my', 'custom'].includes(word));
      if (!baseWords.length) return null;

      let baseHex = resolveNamedColor(baseWords.join(''), context);
      for (let candidateLength = baseWords.length; !baseHex && candidateLength > 0; candidateLength--) {
        for (let start = 0; !baseHex && start <= baseWords.length - candidateLength; start++) {
          const candidate = baseWords.slice(start, start + candidateLength).join('');
          baseHex = resolveNamedColor(candidate, context);
        }
      }
      if (!baseHex) return null;

      return modifierWords.length ? applyShadeModifiers(baseHex, modifierWords) : baseHex;
    }

    function normalizeHexValue(value) {
      const match = value.trim().match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i);
      if (!match) return null;
      const digits = match[1].length === 3
        ? [...match[1]].map((digit) => `${digit}${digit}`).join('')
        : match[1];
      return `#${digits.toUpperCase()}`;
    }

    function commitHexInput() {
      const hex = normalizeHexValue(colorCode.value);
      if (!hex) {
        colorCode.setAttribute('aria-invalid', 'true');
        showFeedback('Enter a 3- or 6-digit hex value, such as #A1B2C3.');
        return false;
      }

      colorCode.setAttribute('aria-invalid', 'false');
      if (hex !== colorCode.value) colorCode.value = hex;
      if (hex === colorSwatch.getAttribute('aria-label').replace('Generated color ', '')) return true;

      updateColor(hex, 'Hex color');
      activeShadeBase = { hex, name: 'Hex color' };
      shadeToggle.hidden = false;
      return true;
    }

    function resolveNamedColor(name, context) {
      if (!name) return null;
      if (/^#[0-9a-f]{6}$/i.test(name)) return name.toUpperCase();

      const preset = colorPresets.find(({ name: presetName }) => presetName.toLowerCase().replace(/[^a-z0-9]/g, '') === name);
      if (preset) return preset.hex;

      context.fillStyle = '#010203';
      context.fillStyle = namedColorAliases.get(name) || name;
      return context.fillStyle === '#010203' ? null : context.fillStyle.toUpperCase();
    }

    function generateCustomShade(name) {
      let nameHash = 2166136261;
      for (const character of name.trim().toLowerCase().replace(/\s+/g, ' ')) {
        nameHash ^= character.codePointAt(0);
        nameHash = Math.imul(nameHash, 16777619);
      }

      const unsignedHash = nameHash >>> 0;
      return hslToHex(unsignedHash % 360, 62 + ((unsignedHash >>> 9) % 19), 42 + ((unsignedHash >>> 18) % 17));
    }

    function applyShadeModifiers(hex, modifierWords) {
      let { hue, saturation, lightness } = hexToHsl(hex);

      const intensity = modifierWords.some((word) => ['very', 'extra', 'ultra'].includes(word)) ? 1.5 : 1;
      for (const word of modifierWords) {
        const adjustment = shadeModifiers.get(word);
        lightness += (adjustment.lightness / 100) * intensity;
        saturation += (adjustment.saturation / 100) * intensity;
        if (adjustment.hueTarget !== undefined) {
          const hueDistance = ((adjustment.hueTarget - hue + 540) % 360) - 180;
          hue += hueDistance * Math.min(1, adjustment.hueInfluence * intensity);
        }
      }

      hue = (hue % 360 + 360) % 360;
      return hslToHex(hue, Math.max(0, Math.min(1, saturation)) * 100, Math.max(0.08, Math.min(0.92, lightness)) * 100);
    }

    function hexToHsl(hex) {
      const red = Number.parseInt(hex.slice(1, 3), 16) / 255;
      const green = Number.parseInt(hex.slice(3, 5), 16) / 255;
      const blue = Number.parseInt(hex.slice(5, 7), 16) / 255;
      const maximum = Math.max(red, green, blue);
      const minimum = Math.min(red, green, blue);
      const delta = maximum - minimum;
      let hue = 0;
      let saturation = 0;
      const lightness = (maximum + minimum) / 2;

      if (delta !== 0) {
        saturation = delta / (1 - Math.abs(2 * lightness - 1));
        if (maximum === red) hue = 60 * (((green - blue) / delta) % 6);
        else if (maximum === green) hue = 60 * ((blue - red) / delta + 2);
        else hue = 60 * ((red - green) / delta + 4);
      }
      if (hue < 0) hue += 360;

      return { hue, saturation, lightness };
    }

    function generateColorShades(hex, count) {
      const { hue, saturation, lightness } = hexToHsl(hex);
      const minimumLightness = 8;
      const maximumLightness = 92;
      const baseIndex = Math.max(0, Math.min(count - 1, Math.round((lightness * 100 - minimumLightness) / (maximumLightness - minimumLightness) * (count - 1))));

      return Array.from({ length: count }, (_, index) => {
        const shadeLightness = minimumLightness + (maximumLightness - minimumLightness) * index / (count - 1);
        return {
          hex: index === baseIndex ? hex : hslToHex(hue, saturation * 100, shadeLightness),
          index,
          isBase: index === baseIndex
        };
      });
    }

    function hslToHex(hue, saturation, lightness) {
      const normalizedSaturation = saturation / 100;
      const normalizedLightness = lightness / 100;
      const chroma = (1 - Math.abs(2 * normalizedLightness - 1)) * normalizedSaturation;
      const huePosition = hue / 60;
      const secondComponent = chroma * (1 - Math.abs((huePosition % 2) - 1));
      let redComponent = 0;
      let greenComponent = 0;
      let blueComponent = 0;

      if (huePosition < 1) [redComponent, greenComponent] = [chroma, secondComponent];
      else if (huePosition < 2) [redComponent, greenComponent] = [secondComponent, chroma];
      else if (huePosition < 3) [greenComponent, blueComponent] = [chroma, secondComponent];
      else if (huePosition < 4) [greenComponent, blueComponent] = [secondComponent, chroma];
      else if (huePosition < 5) [redComponent, blueComponent] = [secondComponent, chroma];
      else [redComponent, blueComponent] = [chroma, secondComponent];

      const lightnessOffset = normalizedLightness - chroma / 2;
      return `#${[redComponent, greenComponent, blueComponent]
        .map((component) => Math.round((component + lightnessOffset) * 255).toString(16).padStart(2, '0'))
        .join('')
        .toUpperCase()}`;
    }

    function showFeedback(message) {
      clearTimeout(feedbackTimeout);
      feedback.textContent = message;
      feedbackTimeout = setTimeout(() => { feedback.textContent = ''; }, 2500);
    }

    async function copyToClipboard() {
      if (!commitHexInput()) return;
      const colorText = colorCode.value;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(colorText);
        } else {
          const temporaryInput = document.createElement('textarea');
          temporaryInput.value = colorText;
          temporaryInput.style.position = 'fixed';
          temporaryInput.style.opacity = '0';
          document.body.append(temporaryInput);
          temporaryInput.select();
          const copied = document.execCommand('copy');
          temporaryInput.remove();
          if (!copied) throw new Error('Clipboard copy failed');
        }
        showFeedback(`Copied ${colorText} to clipboard`);
      } catch {
        showFeedback('Unable to copy color');
      }
    }

    nameForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const enteredName = colorNameInput.value.trim().replace(/\s+/g, ' ');
      if (!enteredName) {
        showFeedback('Enter a color name or shade.');
        return;
      }

      const hexColor = resolveColorName(enteredName);
      const displayName = enteredName.replace(/\b\w/g, (letter) => letter.toUpperCase());
      if (!hexColor) {
        const customHex = generateCustomShade(enteredName);
        updateColor(customHex, displayName);
        activeShadeBase = { hex: customHex, name: displayName };
        shadeToggle.hidden = false;
        showFeedback(`Generated custom shade for ${displayName}`);
        return;
      }

      updateColor(hexColor, displayName);
      activeShadeBase = { hex: hexColor, name: displayName };
      shadeToggle.hidden = false;
      showFeedback(`Found ${displayName}`);
    });

    shadeToggle.addEventListener('click', () => {
      const shadeBase = activeShadeBase;
      if (!shadeBase) return;
      const isExpanded = shadeToggle.getAttribute('aria-expanded') === 'true';
      if (isExpanded) {
        shadeGrid.hidden = true;
        shadeToggle.setAttribute('aria-expanded', 'false');
        shadeToggle.textContent = 'Show shades';
        return;
      }

      const variants = [
        { label: 'Pale', modifiers: ['pale'] },
        { label: 'Light', modifiers: ['light'] },
        { label: 'Soft', modifiers: ['soft'] },
        { label: 'Base', hex: shadeBase.hex },
        { label: 'Bright', modifiers: ['bright'] },
        { label: 'Muted', modifiers: ['muted'] },
        { label: 'Dark', modifiers: ['dark'] },
        { label: 'Deep', modifiers: ['deep'] }
      ];
      shadeGrid.replaceChildren(...variants.map(({ label, modifiers, hex }) => {
        const shadeHex = hex || applyShadeModifiers(shadeBase.hex, modifiers);
        const option = document.createElement('button');
        option.className = 'shade-option';
        option.type = 'button';
        option.setAttribute('aria-label', `${shadeBase.name} ${label}, ${shadeHex}`);
        option.title = `${shadeBase.name} ${label} ${shadeHex}`;
        const chip = document.createElement('span');
        chip.className = 'shade-chip';
        chip.style.backgroundColor = shadeHex;
        const caption = document.createElement('span');
        caption.className = 'shade-label';
        caption.textContent = label;
        option.append(chip, caption);
        option.addEventListener('click', () => updateColor(shadeHex, `${shadeBase.name} ${label}`, true));
        return option;
      }));
      shadeGrid.hidden = false;
      shadeToggle.setAttribute('aria-expanded', 'true');
      shadeToggle.textContent = 'Hide shades';
    });

    generateBtn.addEventListener('click', () => updateColor());
    applyHexBtn.addEventListener('click', () => {
      if (commitHexInput()) showFeedback(`Applied ${colorCode.value}`);
    });
    copyBtn.addEventListener('click', copyToClipboard);
    saveBtn.addEventListener('click', () => {
      if (commitHexInput()) toggleSavedColor(colorCode.value, colorName.textContent);
    });
    colorCode.addEventListener('input', () => colorCode.setAttribute('aria-invalid', 'false'));
    colorCode.addEventListener('blur', commitHexInput);
    colorCode.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        if (commitHexInput()) colorCode.blur();
      }
    });
    dashboardToggle.addEventListener('click', () => setDashboardOpen(dashboardView.hidden));
    dashboardBack.addEventListener('click', () => setDashboardOpen(false));
    paletteTab.addEventListener('click', () => setDashboardTab('palette'));
    savedTab.addEventListener('click', () => setDashboardTab('saved'));
    colorFilter.addEventListener('input', renderDashboard);
    document.addEventListener('keydown', (event) => {
      if (event.code === 'Enter' && !event.repeat && !event.target.closest('button, input, textarea, select, form')) {
        event.preventDefault();
        updateColor();
      }
    });

    updateColor();
  </script>
</body>
</html>
